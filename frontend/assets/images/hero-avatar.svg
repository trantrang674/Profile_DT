<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d2d" />
      <stop offset="55%" stop-color="#1631c9" />
      <stop offset="100%" stop-color="#4f6ef7" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#04081c" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#avatarBg)" rx="20" />
  <circle cx="110" cy="90" r="85" fill="#93b4ff" opacity="0.16" />
  <circle cx="510" cy="310" r="110" fill="#60a5fa" opacity="0.18" />

  <!-- Vòng quỹ đạo chấm đứt nét giống ảnh mẫu AirLume -->
  <circle cx="300" cy="200" r="150" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-dasharray="6 6" />

  <!-- Nhân vật minh họa trung tâm -->
  <g transform="translate(150, 10)">
    <path d="M 85 295 C 85 225, 215 225, 215 295 Z" fill="#4f6ef7" />
    <rect x="135" y="180" width="30" height="30" fill="#fde68a" rx="4" />
    <circle cx="150" cy="148" r="44" fill="#fde68a" />
    <path d="M 108 148 C 108 92, 192 92, 192 148 C 182 126, 140 122, 108 148 Z" fill="#070c22" />
    <circle cx="136" cy="148" r="9" fill="none" stroke="#070c22" stroke-width="3" />
    <circle cx="164" cy="148" r="9" fill="none" stroke="#070c22" stroke-width="3" />
    <line x1="145" y1="148" x2="155" y2="148" stroke="#070c22" stroke-width="3" />
    <path d="M 142 166 Q 150 173 158 166" fill="none" stroke="#070c22" stroke-width="2.5" stroke-linecap="round" />

    <!-- Laptop sáng -->
    <rect x="65" y="210" width="170" height="105" rx="10" fill="#ffffff" />
    <rect x="75" y="220" width="150" height="85" rx="6" fill="#f0f5ff" />
    <rect x="88" y="232" width="65" height="8" rx="4" fill="#1631c9" />
    <rect x="88" y="248" width="124" height="5" rx="2.5" fill="#93b4ff" />
    <rect x="88" y="260" width="105" height="5" rx="2.5" fill="#b8ccf5" />
    <rect x="88" y="278" width="52" height="16" rx="8" fill="#1631c9" />
    <rect x="45" y="315" width="210" height="10" rx="5" fill="#cbd5e1" />
  </g>

  <!-- Floating Badge Trái -->
  <g filter="url(#cardShadow)" transform="translate(28, 36)">
    <rect width="175" height="52" rx="14" fill="#ffffff" />
    <circle cx="28" cy="26" r="14" fill="#eef3ff" />
    <path d="M 21 26 L 26 31 L 35 21" fill="none" stroke="#1631c9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="50" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#070c22">Content Strategy</text>
    <text x="50" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#4b5878">Data-driven Story</text>
  </g>

  <!-- Floating Badge Phải -->
  <g filter="url(#cardShadow)" transform="translate(395, 48)">
    <rect width="175" height="54" rx="14" fill="#ffffff" />
    <circle cx="28" cy="27" r="14" fill="#eef2ff" />
    <path d="M 20 33 L 26 27 L 30 30 L 36 22" fill="none" stroke="#4f6ef7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="50" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#1631c9">+180% Growth</text>
    <text x="50" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#4b5878">Organic Conversion</text>
  </g>
</svg>
